project_name: "Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"
team_name: "RM3Technical"
repo_url: "https://github.com/manangundigara/bob-ai-hackathon--RM3Technical-"
description: |
  An IBM Bob AI-powered assistant that solves three critical supply chain problems:
  1. Detects which shipments are affected by active disruptions (weather, strikes, geopolitical events)
  2. Identifies idle fleet assets and recommends redeployment to overloaded routes
  3. Monitors cold chain IoT sensors to detect temperature excursions and classify regulatory severity BEFORE delivery

tech_stack:
  - Python 3.13
  - Flask
  - IBM Bob AI
  - HTML5 / CSS3 / Vanilla JavaScript
  - Flask-CORS
  - GitHub Actions CI

endpoints:
  - "GET /                                  → Interactive dashboard"
  - "GET/POST /api/disruption               → AI-analyzed disruption impact"
  - "GET/POST /api/fleet                    → Fleet redeployment recommendations"
  - "GET/POST /api/cold-chain               → IoT temperature excursion detection"

demo:
  local_url: "http://127.0.0.1:5000/"
  run_command: "cd src && python app.py"

challenges_addressed:
  - "Identifying shipments affected by active disruptions"
  - "Recommending re-routing or carrier alternatives"
  - "Identifying idle fleet assets for redeployment"
  - "Monitoring cold chain IoT sensor logs and classifying regulatory severity"